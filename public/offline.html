<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>離線中 — 喚雨機器喵後台</title>
<meta name="theme-color" content="#9b6dd6">
<link rel="icon" href="/icons/icon-192.png">
<style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f6f4fb;color:#2b2438;
       font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:24px}
  .card{max-width:420px;text-align:center;background:#fff;border-radius:18px;padding:32px 26px;
        box-shadow:0 12px 40px rgba(90,60,150,.14)}
  img{width:76px;height:76px;border-radius:20px}
  h1{font-size:20px;margin:16px 0 6px}
  p{margin:0 0 18px;line-height:1.7;color:#6b6180;font-size:14px}
  button{border:0;border-radius:12px;padding:11px 22px;background:#9b6dd6;color:#fff;font-size:15px;cursor:pointer}
  @media (prefers-color-scheme:dark){
    body{background:#17141f;color:#efeaf7}.card{background:#1f1b2b;box-shadow:none}p{color:#a99fc0}
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>目前是離線狀態</h1>
    <p>後台的訂單、薪資與報表都要連線才看得到即時數字，<br>所以離線時不提供舊資料，避免對到錯的帳。</p>
    <button onclick="location.replace('/')">重新連線</button>
  </div>
  <script>addEventListener('online', () => location.replace('/'));</script>
</body>
</html>
